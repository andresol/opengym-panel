# JC8012P4A1 v3 production-silicon hardware only. NOT a training application.
# Source: EspControl v2.13.0, commit 9bf8567f1272b0b2bbe7788de95e8772620561bf.
# Keep separate from the legacy original-batch profile and existing Home/Hytta.
# See docs/HARDWARE.md for provenance, recovery and unverified physical tests.
esp32:
  variant: ESP32P4
  flash_size: 16MB
  cpu_frequency: 360MHz
  engineering_sample: false
  # Match the deployed EspControl partition offsets for any future native OTA.
  partitions: hardware/partitions-espcontrol-v3.csv
  framework:
    type: esp-idf
    version: 5.5.5
    advanced:
      enable_idf_experimental_features: true
      execute_from_psram: true
      disable_vfs_support_termios: false
      disable_vfs_support_select: false
      disable_vfs_support_dir: false
    sdkconfig_options:
      CONFIG_SDMMC_HOST_DEFAULT: "y"
      CONFIG_LWIP_MAX_SOCKETS: "20"
      CONFIG_ESP_MAIN_TASK_STACK_SIZE: "8192"
      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: "y"
      CONFIG_ESP_TASK_WDT_TIMEOUT_S: "60"
      CONFIG_SPI_FLASH_YIELD_DURING_ERASE: "n"
      CONFIG_ESP_HOSTED_USE_MEMPOOL: "n"
      CONFIG_ESP_HOSTED_DFLT_TASK_FROM_SPIRAM: "y"
      CONFIG_FREERTOS_THREAD_LOCAL_STORAGE_POINTERS: "1"
      CONFIG_LOG_DEFAULT_LEVEL: "2"

external_components:
  - source:
      type: local
      path: custom_components_v3
    components: [mipi_dsi, gsl3680]

esp32_hosted:
  variant: esp32c6
  reset_pin: GPIO54
  cmd_pin: GPIO19
  clk_pin: GPIO18
  d0_pin: GPIO14
  d1_pin: GPIO15
  d2_pin: GPIO16
  d3_pin: GPIO17
  active_high: true
  sdio_frequency: 40MHz

psram:
  mode: hex
  speed: 200MHz

esp_ldo:
  - channel: 3
    id: dsi_phy_enable
    voltage: 2.5V
    adjustable: true

output:
  - platform: ledc
    id: backlight_output
    pin: GPIO23
    frequency: 20000Hz

light:
  - platform: monochromatic
    id: display_backlight
    name: Skjermlys
    output: backlight_output
    restore_mode: RESTORE_DEFAULT_ON
    default_transition_length: 0s
    gamma_correct: 1.0

i2c:
  - id: touch_i2c
    sda: GPIO7
    scl: GPIO8
    scan: false
    frequency: 400kHz
    sda_pullup_enabled: false
    scl_pullup_enabled: false

touchscreen:
  - platform: gsl3680
    id: panel_touch
    i2c_id: touch_i2c
    reset_pin: GPIO22
    interrupt_pin: GPIO21
    touch_timeout: 50ms
    transform:
      swap_xy: false
      mirror_x: true
      mirror_y: false

logger:
  hardware_uart: UART0

display:
  - platform: mipi_dsi
    id: panel_display
    model: CUSTOM
    color_order: RGB
    pixel_mode: 16bit
    pclk_frequency: 70MHz
    lanes: 2
    lane_bit_rate: 840Mbps
    hsync_pulse_width: 20
    hsync_back_porch: 20
    hsync_front_porch: 40
    vsync_pulse_width: 4
    vsync_back_porch: 10
    vsync_front_porch: 30
    reset_pin:
      number: GPIO27
    update_interval: never
    auto_clear_enabled: false
    dimensions:
      width: 800
      height: 1280
    init_sequence:
