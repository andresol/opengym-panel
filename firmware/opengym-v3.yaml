# Supported hardware: JC8012P4A1 v3. Community source edition.
# Profile-bound OpenGym workout logging; no HA equipment actions.
esphome:
  name: ${panel_name}
  friendly_name: ${panel_friendly_name}
  min_version: 2026.10.0
  compile_process_limit: 2
  project:
    name: sollie.opengym-panel
    version: 1.1.33-community.2
  on_boot:
    priority: -100
    then:
      - lambda: |-
          id(native_gym).begin(id(f16)->get_lv_font(), id(f20)->get_lv_font(),
                               id(f30)->get_lv_font(), id(f42)->get_lv_font(), id(f18)->get_lv_font());
          // ESPHome 2026.9 web routes match the entity name, not its object ID.
          // The browser URL-encodes these names before submitting an action.
          auto web_name = [](const esphome::EntityBase *entity) {
            return std::string(entity->get_name().c_str());
          };
          id(native_gym).set_admin_routes(std::array<std::string, 8>{
              web_name(id(night_start)), web_name(id(night_end)),
              web_name(id(day_brightness)), web_name(id(night_brightness)),
              web_name(id(wake_minutes)), web_name(id(night_enabled)),
              web_name(id(save_display_settings)), web_name(id(display_backlight))});

packages:
  installation_defaults: !include config/installation.defaults.json
  hardware: !include hardware/jc8012p4a1-v3.yaml

external_components:
  - source:
      type: local
      path: custom_components
    components: [gym_native]

logger:
  level: WARN

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # DHCP by default. The local installation wrapper can opt into a static address.
  power_save_mode: none
  reboot_timeout: 0s

api:
  encryption:
    key: !secret native_api_key
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret native_ota_password

gym_native:
  id: native_gym
  url: !secret native_url
  token: !secret native_token
  write_token: !secret native_write_token
  timezone: ${panel_timezone}
  language: ${panel_language}
  backlight: display_backlight
  clock: panel_clock
  display_lvgl: training_lvgl

sensor:
  - platform: uptime
    name: Oppetid
    update_interval: 10s

text_sensor:
  - platform: template
    name: Paneldiagnostikk
    id: native_diagnostics
    entity_category: diagnostic
    disabled_by_default: true
    update_interval: 2s
    lambda: return id(native_gym).diagnostics();
  - platform: template
    name: Firmware version
    entity_category: diagnostic
    update_interval: 60s
    lambda: return {ESPHOME_PROJECT_VERSION};
  - platform: wifi_info
    ip_address:
      name: IP address
      entity_category: diagnostic

font:
  - file: fonts/DejaVuSans.ttf
    id: f16
    size: 16
    bpp: 4
    glyphsets: [GF_Latin_Core]
    glyphs: ['‹', '›', '−', '…', '×', '·', '—']
  - file: fonts/DejaVuSans.ttf
    id: f18
    size: 18
    bpp: 4
    glyphsets: [GF_Latin_Core]
    glyphs: ['‹', '›', '−', '…', '×', '·', '—']
  - file: fonts/DejaVuSans.ttf
    id: f20
    size: 20
    bpp: 4
    glyphsets: [GF_Latin_Core]
    glyphs: ['‹', '›', '−', '…', '×', '·', '—', '→', '✓', '↓']
  - file: fonts/DejaVuSans.ttf
    id: f30
    size: 30
    bpp: 4
    glyphsets: [GF_Latin_Core]
    glyphs: ['‹', '›', '−', '…', '×', '·', '—']
  - file: fonts/DejaVuSans.ttf
    id: f42
    size: 42
    bpp: 4
    glyphsets: [GF_Latin_Core]
    glyphs: ['‹', '›', '−', '…', '×', '·', '—']

lvgl:
  id: training_lvgl
  resume_on_input: true
  on_resume:
    then:
      - lambda: id(native_gym).wake_display();
  displays: [panel_display]
  touchscreens: [panel_touch]
  rotation: 90
  color_depth: 16
  byte_order: little_endian
  buffer_size: 25%
  default_font: f20
  log_level: WARN
  pages:
    - id: training_screen
      bg_color: 0x17191B
      pad_all: 0
      scrollable: false
      widgets:
        # Register all font engines; the native component creates the visible UI.
        - label:
            hidden: true
            text: ''
            text_font: f16
        - label:
            hidden: true
            text: ''
            text_font: f18
        - label:
            hidden: true
            text: ''
            text_font: f30
        - label:
            hidden: true
            text: ''
            text_font: f42


# Firmware is the sole schedule authority. Network/API and workouts stay alive.
time:
  - platform: sntp
    id: panel_clock
    timezone: ${panel_timezone}

preferences:
  flash_write_interval: 1s

light:
  - id: !extend display_backlight
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - lambda: id(native_gym).external_display(true);
    on_turn_off:
      - lambda: id(native_gym).external_display(false);

touchscreen:
  - id: !extend panel_touch
    on_touch:
      - lambda: id(native_gym).note_touch();

web_server:
  port: 80
  version: 3
  local: true
  include_internal: false
  ota: false
  log: false
  auth:
    username: !secret admin_username
    password: !secret admin_password

switch:
  - platform: template
    id: night_enabled
    name: Nattmodus
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

number:
  - platform: template
    id: night_start
    name: Natt start
    entity_category: config
    min_value: 0
    max_value: 1439
    step: 1
    initial_value: 1380
    optimistic: true
    restore_value: true
  - platform: template
    id: night_end
    name: Natt slutt
    entity_category: config
    min_value: 0
    max_value: 1439
    step: 1
    initial_value: 420
    optimistic: true
    restore_value: true
  - platform: template
    id: day_brightness
    name: Lys dag
    entity_category: config
    unit_of_measurement: '%'
    min_value: 10
    max_value: 100
    step: 1
    initial_value: 100
    optimistic: true
    restore_value: true
  - platform: template
    id: night_brightness
    name: Lys natt
    entity_category: config
    unit_of_measurement: '%'
    min_value: 5
    max_value: 50
    step: 1
    initial_value: 20
    optimistic: true
    restore_value: true
  - platform: template
    id: wake_minutes
    name: Vekketid
    entity_category: config
    unit_of_measurement: min
    min_value: 1
    max_value: 30
    step: 1
    initial_value: 5
    optimistic: true
    restore_value: true

button:
  - platform: template
    id: save_display_settings
    name: Lagre skjerminnstillinger
    entity_category: config
    on_press:
      - lambda: id(native_gym).settings_saved(esphome::global_preferences->sync());

interval:
  - interval: 1s
    then:
      - lambda: |-
          id(native_gym).configure_display(id(night_enabled).state,
              id(night_start).state, id(night_end).state, id(day_brightness).state,
              id(night_brightness).state, id(wake_minutes).state);
