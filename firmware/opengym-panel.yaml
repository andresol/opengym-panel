# Sollie OpenGym Panel 1.0.0-rc1 — JC8012P4A1 ORIGINAL profile, not physically verified.
# New panels can have a different board revision. Do not flash existing Home/Hytta panels.
esphome:
  name: opengym-panel
  friendly_name: OpenGym panel
  min_version: 2026.9.0
  project:
    name: sollie.opengym-panel
    version: 1.0.0-rc1
  compile_process_limit: 2
  on_boot:
    priority: -100
    then:
      - lambda: |-
          id(gym).bind(id(routine),id(position),id(exercise),id(target),id(load),id(detail_label),id(note),id(timer),id(status),id(date),id(timer_action),
            {id(day0),id(day1),id(day2),id(day3),id(day4),id(day5),id(day6)},
            {id(prev),id(next),id(minus),id(plus),id(timer_start),id(timer_reset)});
external_components:
  - source: {type: local, path: custom_components}
    components: [gsl3680, gym_panel]
esp32:
  variant: ESP32P4
  flash_size: 16MB
  engineering_sample: true
  framework:
    type: esp-idf
    advanced:
      enable_idf_experimental_features: true
      execute_from_psram: true
    sdkconfig_options:
      CONFIG_ESP_MAIN_TASK_STACK_SIZE: "8192"
      CONFIG_LWIP_TCP_WND_DEFAULT: "32768"
      CONFIG_LWIP_TCP_RECVMBOX_SIZE: "25"
      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: "y"
      CONFIG_ESP_TASK_WDT_TIMEOUT_S: "60"
      CONFIG_ESP_HOSTED_USE_MEMPOOL: "n"
      CONFIG_ESP_HOSTED_DFLT_TASK_FROM_SPIRAM: "y"

esp32_hosted:
  variant: esp32c6
  reset_pin: GPIO54
  cmd_pin: GPIO19
  clk_pin: GPIO18
  d0_pin: GPIO14
  d1_pin: GPIO15
  d2_pin: GPIO16
  d3_pin: GPIO17
  active_high: true
  sdio_frequency: 20MHz

psram:
  mode: hex
  speed: 200MHz

esp_ldo:
  - channel: 3
    id: dsi_phy_enable
    voltage: 2.5V
    adjustable: true

output:
  - platform: ledc
    id: backlight_output
    pin: GPIO23

light:
  - platform: monochromatic
    id: display_backlight
    name: Skjermlys
    output: backlight_output
    restore_mode: ALWAYS_ON
    default_transition_length: 250ms
    gamma_correct: 1.0

i2c:
  - id: touch_i2c
    sda: GPIO7
    scl: GPIO8
    scan: false
    frequency: 400kHz
    sda_pullup_enabled: false
    scl_pullup_enabled: false

touchscreen:
  - platform: gsl3680
    id: panel_touch
    i2c_id: touch_i2c
    reset_pin: GPIO22
    interrupt_pin: GPIO21
    touch_timeout: 50ms
    update_interval: 20ms
    transform:
      swap_xy: false
      # This is fixed hardware calibration, not screen orientation. LVGL owns
      # the final rotation for both panel_display and panel_touch because they
      # are bound together in ui.yaml. Never change these mirrors when changing
      # lvgl.rotation; doing so applies the rotation twice and breaks touch.
      mirror_x: true
      mirror_y: false
    on_touch:
      - light.turn_on: display_backlight

display:
  - platform: mipi_dsi
    id: panel_display
    # This physical batch 2627 previously rendered correctly with EspControl's
    # original JC8012P4A1 profile. The V2 profile produced a black screen and
    # prevented the device from reaching the network, so physical evidence
    # takes precedence over the generic batch table.
    model: JC8012P4A1
    reset_pin: GPIO27
    update_interval: 17ms
    auto_clear_enabled: false
    color_order: RGB
    dimensions:
      width: 800
      height: 1280

logger:
  level: WARN
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  reboot_timeout: 0s
api:
  encryption:
    key: !secret api_key
  reboot_timeout: 0s
ota:
  - platform: esphome
    password: !secret ota_password
gym_panel:
  id: gym
  url: !secret panel_url
  token: !secret panel_token
packages:
  ui: !include ui.yaml
